<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0">
  <defs>
    <!-- Camera Icon -->
    <symbol id="icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <circle cx="12" cy="12" r="3"/>
      <line x1="12" y1="2" x2="12" y2="4"/>
    </symbol>

    <!-- Fullscreen Icon -->
    <symbol id="icon-fullscreen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="4" y="4" width="16" height="16" rx="2"/>
      <line x1="4" y1="12" x2="8" y2="12"/>
      <line x1="16" y1="12" x2="20" y2="12"/>
      <line x1="12" y1="4" x2="12" y2="8"/>
      <line x1="12" y1="16" x2="12" y2="20"/>
    </symbol>

    <!-- Region Icon -->
    <symbol id="icon-region" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="4" y="4" width="10" height="10" stroke-dasharray="2 2"/>
      <circle cx="18" cy="18" r="3" fill="currentColor" stroke="none"/>
    </symbol>

    <!-- Window Icon -->
    <symbol id="icon-window" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="14" rx="2"/>
      <line x1="3" y1="9" x2="21" y2="9"/>
      <circle cx="6" cy="6" r="1" fill="currentColor"/>
      <circle cx="9" cy="6" r="1" fill="currentColor"/>
    </symbol>

    <!-- Pen/Draw Icon -->
    <symbol id="icon-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M17 3a2.828 2.828 0 1 1 4 4l-9 9a4 4 0 1 1-5.657 5.656l1.414 1.415a2 2 0 1 1 2.828 2.828l6-6z"/>
    </symbol>

    <!-- Arrow Icon -->
    <symbol id="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12,5 19,12 12,19"/>
    </symbol>

    <!-- Text Icon -->
    <symbol id="icon-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="4,7 4,4 20,4 20,7"/>
      <line x1="9" y1="20" x2="15" y2="20"/>
      <line x1="9" y1="16" x2="15" y2="16"/>
    </symbol>

    <!-- Square/Shape Icon -->
    <symbol id="icon-square" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="4" y="4" width="16" height="16" rx="2"/>
    </symbol>

    <!-- Highlight Icon -->
    <symbol id="icon-highlight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 11l-6 6v6h6"/>
      <path d="M21 5v14"/>
    </symbol>

    <!-- Undo Icon -->
    <symbol id="icon-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 7v6h6"/>
      <path d="M3 7l6-6"/>
      <path d="M21 17a9 9 0 0 1-9-9 9 9 0 0 1 9 9"/>
    </symbol>

    <!-- Redo Icon -->
    <symbol id="icon-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 7v-6h-6"/>
      <path d="M21 7l-6 6"/>
      <path d="M3 17a9 9 0 0 0 9-9 9 9 0 0 0-9 9"/>
    </symbol>

    <!-- Export Icon -->
    <symbol id="icon-export" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7,10 12,15 17,10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </symbol>

    <!-- Settings/Gear Icon -->
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 1v6m0 6v6m0-6v-6"/>
      <path d="M1 12h6m6 0h6m-6 0h-6"/>
      <path d="M4.2 4.2l4.2 4.2m8.4 8.4l-4.2-4.2"/>
      <path d="M4.2 19.8l4.2-4.2m8.4-8.4l-4.2 4.2"/>
    </symbol>

    <!-- Hotkey Icon -->
    <symbol id="icon-hotkey" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="2" y="6" width="20" height="12" rx="2"/>
      <line x1="6" y1="12" x2="6" y2="12"/>
      <line x1="10" y1="12" x2="10" y2="12"/>
      <line x1="14" y1="12" x2="14" y2="12"/>
      <line x1="18" y1="12" x2="18" y2="12"/>
    </symbol>
  </defs>
</svg>
